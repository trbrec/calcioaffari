name: Build Local Newsroom installer

on:
  push:
    branches:
      - agent/pairing-token
    paths:
      - "companion/calcioaffari-local-agent/**"
      - "tests/test_local_newsroom_132.py"
      - "tests/test_local_newsroom_132_runtime.ps1"
      - "tests/ollama_stub.py"
      - ".github/workflows/build-local-newsroom.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem companion/calcioaffari-local-agent -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }

      - name: Run Local Newsroom regressions
        shell: pwsh
        run: python -m unittest -v tests/test_local_newsroom_132.py

      - name: Exercise resource profiles on Windows
        shell: pwsh
        run: |
          . .\companion\calcioaffari-local-agent\common.ps1
          $eco = Get-CalcioAffariResourceProfile Eco
          $balanced = Get-CalcioAffariResourceProfile Bilanciato
          $performance = Get-CalcioAffariResourceProfile Prestazioni
          if ($eco.NumThread -ne 3 -or $eco.MaxBurstJobs -ne 1 -or -not $eco.DeferOnExternalGpuLoad) { throw "Eco profile qualification failed." }
          if ($balanced.NumThread -ne 4 -or $balanced.MaxBurstJobs -ne 2 -or -not $balanced.DeferOnExternalGpuLoad) { throw "Balanced profile qualification failed." }
          if ($performance.NumThread -ne 6 -or $performance.MaxBurstJobs -ne 5 -or $performance.DeferOnExternalGpuLoad) { throw "Performance profile qualification failed." }

      - name: Prove active inference preemption on Windows
        shell: powershell
        run: .\tests\test_local_newsroom_132_runtime.ps1

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found." }
          & $iscc "companion\calcioaffari-local-agent\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify clean silent installation
        shell: pwsh
        run: |
          $setup = Resolve-Path "companion\calcioaffari-local-agent\dist\CalcioAffari-Local-Newsroom-Setup-v1.3.2.exe"
          $target = Join-Path $env:RUNNER_TEMP "CalcioAffari-qualification"
          $process = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)." }
          foreach ($name in @("agent-1.3.2.ps1", "version-1.3.2.json", "install.ps1", "dashboard.ps1", "heartbeat.ps1")) {
            if (-not (Test-Path (Join-Path $target $name))) { throw "Missing installed payload: $name" }
          }
          $manifest = Get-Content (Join-Path $target "version-1.3.2.json") -Raw | ConvertFrom-Json
          if ($manifest.version -ne "1.3.2") { throw "Installed version mismatch." }

          . (Join-Path $target "common.ps1")
          Set-CalcioAffariDependencyOwnership -InstallDir $target -OllamaInstalledByCalcioAffari $false -ModelInstalledByCalcioAffari $false -Model "qwen3:14b"
          $state = Get-CalcioAffariDependencyState -InstallDir $target
          if ($state.ollama_installed_by_calcioaffari -or $state.model_installed_by_calcioaffari) { throw "Pre-existing dependency ownership was not preserved." }

          $uninstaller = Resolve-Path (Join-Path $target "unins000.exe")
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)." }
          if (Test-Path (Join-Path $target "agent-1.3.2.ps1")) { throw "Application payload remained after uninstall." }

      - name: Write checksums
        shell: pwsh
        run: |
          $file = "companion\calcioaffari-local-agent\dist\CalcioAffari-Local-Newsroom-Setup-v1.3.2.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CalcioAffari-Local-Newsroom-Setup-v1.3.2.exe" | Set-Content "companion\calcioaffari-local-agent\dist\SHA256SUMS.txt" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: CalcioAffari-Local-Newsroom-1.3.2
          path: |
            companion/calcioaffari-local-agent/dist/CalcioAffari-Local-Newsroom-Setup-v1.3.2.exe
            companion/calcioaffari-local-agent/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
