name: Validate CalcioAffari

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
      - name: Lint PHP
        shell: bash
        run: |
          failed=0
          while IFS= read -r file; do
            php -l "$file" || failed=1
          done < <(git ls-files '*.php')
          exit "$failed"

      - name: Verify AJAX pairing transport
        shell: bash
        run: |
          php -r '
            define("ABSPATH", __DIR__);
            require "companion/calcioaffari-news-engine/includes/class-ca-news-rest.php";
            $token = "CaPairing2026TokenWithoutHttpBasicAuth";
            $form = array("agent_token" => $token, "payload" => json_encode(array("model" => "qwen3:14b", "result" => array("title" => "Test"))));
            $decoded = CA_News_REST::decode_ajax_payload($form, "");
            if (($decoded["agent_token"] ?? "") !== $token || ($decoded["result"]["title"] ?? "") !== "Test") { throw new Exception("Form transport round-trip failed"); }
            $legacy = CA_News_REST::decode_ajax_payload(array(), json_encode(array("agent_token" => $token)));
            if (($legacy["agent_token"] ?? "") !== $token) { throw new Exception("Legacy JSON transport failed"); }
          '

      - name: Verify bounded retry decisions
        shell: bash
        run: |
          php -r '
            define("ABSPATH", __DIR__);
            require "companion/calcioaffari-news-engine/includes/class-ca-news-rest.php";
            $first = CA_News_REST::retry_decision(true, 1, 3);
            $last = CA_News_REST::retry_decision(true, 3, 3);
            $deterministic = CA_News_REST::retry_decision(false, 1, 3);
            if ($first["status"] !== "pending" || !$first["retryable"]) { throw new Exception("Temporary first failure should retry"); }
            if ($last["status"] !== "rejected" || $last["retryable"]) { throw new Exception("Maximum attempts must terminate"); }
            if ($deterministic["status"] !== "rejected") { throw new Exception("Deterministic failures must terminate immediately"); }
            if (!CA_News_REST::agent_version_supported("CalcioAffari-LocalAgent/1.0.9")) { throw new Exception("Current agent must be accepted"); }
            if (CA_News_REST::agent_version_supported("CalcioAffari-LocalAgent/1.0.8")) { throw new Exception("Agent without the editorial preflight must be blocked before claiming jobs"); }
            if (CA_News_REST::agent_version_supported("CalcioAffari-LocalAgent/1.0.4")) { throw new Exception("Outdated agent must be blocked before claiming jobs"); }
            if (CA_News_REST::agent_version_supported("UnknownClient/9.9")) { throw new Exception("Unknown clients must not claim jobs"); }
          '

      - name: Verify AI output safeguards
        shell: bash
        run: |
          php -r '
            define("ABSPATH", __DIR__);
            function __($value) { return $value; }
            function wp_strip_all_tags($value) { return strip_tags($value); }
            function remove_accents($value) { return $value; }
            function sanitize_key($value) { return strtolower(preg_replace("/[^a-z0-9_-]/i", "", $value)); }
            require "companion/calcioaffari-news-engine/includes/class-ca-news-ingestor.php";
            require "companion/calcioaffari-news-engine/includes/class-ca-news-publisher.php";
            $body = str_repeat("Contenuto giornalistico verificato e riscritto in forma originale. ", 10);
            $from_body = CA_News_Publisher::normalize_excerpt("Breve", $body);
            if (mb_strlen($from_body) < 45 || mb_strlen($from_body) > 360) { throw new Exception("Short excerpt was not repaired."); }
            $long = CA_News_Publisher::normalize_excerpt(str_repeat("sommario molto lungo ", 30), $body);
            if (mb_strlen($long) < 45 || mb_strlen($long) > 360 || !str_ends_with($long, "…")) { throw new Exception("Long excerpt was not bounded."); }
            $clean = CA_News_Publisher::sanitize_inline_urls("<p>Testo <a href=\"https://example.com/a\">fonte</a> https://example.com/b</p>", true);
            if (str_contains($clean, "http") || !str_contains($clean, "fonte")) { throw new Exception("Inline URL sanitization lost copy or left a URL."); }
            $markers = CA_News_Publisher::sanitize_internal_markers("<p>Testo (ID: 5) e [source_id: 12].</p>");
            if (preg_match("/ID|source_id/i", $markers)) { throw new Exception("Internal evidence markers were not removed."); }
            $evidence = array(array("source" => "aol.co.uk", "url" => "https://www.aol.co.uk/articles/test"));
            $sources = CA_News_Publisher::sanitize_source_mentions("Secondo aol.co.uk e www.aol.co.uk il fatto è da verificare.", $evidence);
            if (preg_match("/aol\\.co\\.uk/i", $sources) || !str_contains($sources, "giornalistic")) { throw new Exception("Source attribution sanitization failed: " . $sources); }
            $italian = CA_News_Publisher::normalize_italian_copy("La preparazione di Arsenal non riguarda la Chelsea. Arseanal resta un refuso.");
            if (!str_contains($italian, "dell’Arsenal") || !str_contains($italian, "il Chelsea") || str_contains($italian, "Arseanal")) { throw new Exception("Observed Italian copy errors were not normalized."); }
            $thin = array(array("id" => 1, "title" => "Headline only", "excerpt" => "Headline only"));
            if (!CA_News_Publisher::has_thin_evidence($thin, array(1))) { throw new Exception("Headline-only evidence was not marked as thin."); }
            if (CA_News_Publisher::editorial_length_warning(175, 160, 360) !== "") { throw new Exception("Valid length produced a warning."); }
            if (!str_contains(CA_News_Publisher::editorial_length_warning(96, 160, 360), "96 parole")) { throw new Exception("Out-of-target length did not produce a warning."); }
            if (!CA_News_Publisher::has_non_italian_copy("Manchester United reach agreement for new signing", str_repeat("Testo italiano verificato con le prove disponibili. ", 25))) { throw new Exception("Untranslated English title was not blocked."); }
            if (!CA_News_Publisher::has_non_italian_copy("Possibile debutto di孔萨 contro维拉", str_repeat("Testo italiano verificato. ", 25))) { throw new Exception("Unsupported script was not blocked."); }
            if (CA_News_Publisher::has_non_italian_copy("Il Manchester United raggiunge un accordo per il nuovo acquisto", str_repeat("Il club ha definito l’operazione secondo le informazioni disponibili e la trattativa resta soggetta agli ultimi passaggi formali. ", 12))) { throw new Exception("Valid Italian copy was rejected."); }
            $without_heading = CA_News_Publisher::remove_redundant_leading_heading("<h2>Il Milan chiude per il nuovo difensore</h2><p>Testo sostanziale.</p>", "Il Milan chiude per il nuovo difensore dopo l’accordo");
            if (str_contains($without_heading, "<h2>")) { throw new Exception("A title-duplicating first heading was not removed."); }
          '
          grep -q "'excerpt' => array('type' => 'string', 'minLength' => 80, 'maxLength' => 280)" companion/calcioaffari-news-engine/includes/class-ca-news-rest.php
          grep -q 'ca_news_retry_rejected_jobs' companion/calcioaffari-news-engine/includes/class-ca-news-admin.php
          grep -q "WHERE status='rejected' AND error_message=%s" companion/calcioaffari-news-engine/calcioaffari-news-engine.php
          grep -q "ca_news_excerpt_recovery_version" companion/calcioaffari-news-engine/calcioaffari-news-engine.php
          grep -q "ca_news_length_recovery_version" companion/calcioaffari-news-engine/calcioaffari-news-engine.php
          grep -q "ca_news_editorial_recovery_version" companion/calcioaffari-news-engine/calcioaffari-news-engine.php
          grep -q "Qwen3 non ha rispettato la lunghezza editoriale" companion/calcioaffari-news-engine/calcioaffari-news-engine.php
          grep -q "ca_news_inline_url" companion/calcioaffari-news-engine/includes/class-ca-news-rest.php
          ! grep -q "'ca_news_bad_length'.*retryable_codes" companion/calcioaffari-news-engine/includes/class-ca-news-rest.php
          grep -q "'validation' => array" companion/calcioaffari-news-engine/includes/class-ca-news-rest.php
          grep -q "'article_retry'" companion/calcioaffari-news-engine/includes/class-ca-news-rest.php
          ! grep -q 'brief di 80-140 parole' companion/calcioaffari-news-engine/includes/class-ca-news-rest.php
          grep -q 'Titolo, sommario e corpo devono essere interamente in italiano' companion/calcioaffari-news-engine/includes/class-ca-news-rest.php
          grep -q 'Mappatura delle affermazioni incompleta' companion/calcioaffari-news-engine/includes/class-ca-news-publisher.php
          grep -q 'ca_news_body_too_short' companion/calcioaffari-news-engine/includes/class-ca-news-publisher.php
          grep -q 'ca_news_insufficient_evidence' companion/calcioaffari-news-engine/includes/class-ca-news-publisher.php
          ! grep -q "retryable_codes.*ca_news_body_too_short" companion/calcioaffari-news-engine/includes/class-ca-news-rest.php
          ! grep -q "retryable_codes.*ca_news_non_italian_copy" companion/calcioaffari-news-engine/includes/class-ca-news-rest.php
          grep -q "\$event_type = 'other'" companion/calcioaffari-news-engine/includes/class-ca-news-publisher.php

      - name: Verify professional source admission gate
        shell: bash
        run: |
          php -r '
            define("ABSPATH", __DIR__);
            function wp_strip_all_tags($value) { return strip_tags($value); }
            function sanitize_key($value) { return strtolower(preg_replace("/[^a-z0-9_-]/i", "", $value)); }
            require "companion/calcioaffari-news-engine/includes/class-ca-news-ingestor.php";
            $detail = str_repeat("Manchester United have reached an agreement to sign the defender after negotiations with his current club. ", 4);
            if (CA_News_Ingestor::editorial_item_rejection_reason("Manchester United reach agreement for defender transfer", $detail, "en") !== "") { throw new Exception("A substantive transfer report was rejected."); }
            $accepted = array(
              "Tottenham close on deals for two Manchester City players",
              "Lazio push for Hull target Pinamonti after Dieng move",
              "Roma continue talks with Inter over Luis Henrique",
              "Genoa weigh move for ex-Inter striker Taremi",
              "Nottingham Forest and Crystal Palace chase Fiorentina defender",
              "Barcelona have agreement with Inter star",
              "Juventus planning to sign three more players",
              "Liverpool midfielder Jones arrives for Inter medical",
              "Ravenna new boy Ronaldinho is happy to be here",
              "Milan enter Torino’s Cacciamani race as Roma push to beat Cairo’s asking price",
              "Official – Juventus confirm Arthur contract termination: Negative economic impact"
            );
            foreach ($accepted as $headline) {
              if (CA_News_Ingestor::editorial_item_rejection_reason($headline, $detail, "en") !== "") { throw new Exception("A verified transfer headline was rejected: " . $headline); }
            }
            $bad = array(
              array("Possibile debutto di孔萨 contro维拉", $detail, "en", "Chinese headline"),
              array("Carlos Alcaraz prepares for US Open transfer of momentum", str_repeat("The tennis player prepares for the US Open after his latest match. ", 5), "en", "tennis"),
              array("NCAA transfer portal eligibility case continues", str_repeat("The college football eligibility case remains before the NCAA after a transfer portal dispute. ", 5), "en", "NCAA"),
              array("Premier League match preview and predicted lineup", str_repeat("Kick-off time, starting XI and scores and fixtures for the season opener. ", 6), "en", "preview"),
              array("A huge honour for the Socceroos World Cup star", $detail, "en", "generic football feature"),
              array("Robot building and Essien: Yirenkyi circuitous path to the top", $detail, "en", "player profile"),
              array("Ronaldinho on a mission of love and happiness", $detail, "en", "celebrity feature"),
              array("PSG are the best team in Europe and Ligue 1 is back", $detail, "en", "competition feature"),
              array("Stankovic hails Chivu and expresses delight at Inter", $detail, "en", "interview"),
              array("Obiang promoted as former West Ham midfielder changes role", $detail, "en", "internal promotion"),
              array("Moreira: Playing for Milan means winning trophies", $detail, "en", "generic interview"),
              array("Atalanta vs Hapoel Tel Aviv: Scalvini forced off", $detail, "en", "match report"),
              array("Milan owner Cardinale expected to hold talks with executives", $detail, "en", "corporate meeting"),
              array("Mikel Arteta sets Arsenal a title target for the new season", $detail, "en", "sporting target"),
              array("Manchester United complete defender transfer", "Manchester United complete defender transfer", "en", "headline-only"),
              array("Manchester United complete defender transfer", $detail, "zh", "unsupported language")
            );
            foreach ($bad as $case) {
              if (CA_News_Ingestor::editorial_item_rejection_reason($case[0], $case[1], $case[2]) === "") { throw new Exception("Observed " . $case[3] . " failure entered the queue."); }
            }
          '
          grep -q 'feeds.bbci.co.uk/sport/football/rss.xml' companion/calcioaffari-news-engine/includes/class-ca-news-sources.php
          grep -q 'theguardian.com/football/rss' companion/calcioaffari-news-engine/includes/class-ca-news-sources.php
          grep -q 'skysports.com/rss/12040' companion/calcioaffari-news-engine/includes/class-ca-news-sources.php
          grep -q 'football-italia.net/feed/' companion/calcioaffari-news-engine/includes/class-ca-news-sources.php
          grep -q "source_type='gdelt'" companion/calcioaffari-news-engine/includes/class-ca-news-sources.php
          grep -q 'ca_news_professional_sources_version' companion/calcioaffari-news-engine/calcioaffari-news-engine.php
          grep -q 'ca_news_strict_market_filter_version' companion/calcioaffari-news-engine/calcioaffari-news-engine.php
          grep -q 'revalidate_open_jobs' companion/calcioaffari-news-engine/includes/class-ca-news-ingestor.php

      - name: Verify conservative story clustering
        shell: bash
        run: |
          php -r '
            define("ABSPATH", __DIR__);
            function remove_accents($value) { return $value; }
            require "companion/calcioaffari-news-engine/includes/class-ca-news-ingestor.php";
            $false_merge_a = "Mikel Arteta sets Arsenal a title target for the new season";
            $false_merge_b = "Mikel Arteta reveals concern over Bruno Guimaraes injury";
            if (CA_News_Ingestor::titles_are_same_story($false_merge_a, $false_merge_b)) { throw new Exception("A shared person name merged two different stories."); }
            $same_a = "Manchester United reach agreement for Carlos Baleba transfer";
            $same_b = "Carlos Baleba transfer agreement reached with Manchester United";
            if (!CA_News_Ingestor::titles_are_same_story($same_a, $same_b)) { throw new Exception("A clear duplicate story was not clustered."); }
          '

      - name: Verify pairing hash bypasses the WordPress option cache
        shell: bash
        run: |
          ! grep -q "get_option('ca_news_agent_token_hash'" companion/calcioaffari-news-engine/includes/class-ca-news-rest.php
          grep -q 'CA_News_DB::agent_token_hash' companion/calcioaffari-news-engine/includes/class-ca-news-rest.php
          grep -q 'store_agent_token_hash' companion/calcioaffari-news-engine/includes/class-ca-news-admin.php
          php -r '
            define("ABSPATH", __DIR__);
            function current_time() { return "2026-08-18 18:00:00"; }
            final class PairingTestWpdb {
              public string $prefix = "wp_";
              private string $hash = "";
              public function replace($table, $data, $formats) { $this->hash = (string) $data["token_hash"]; return 1; }
              public function get_var($query) { return $this->hash; }
            }
            $wpdb = new PairingTestWpdb();
            require "companion/calcioaffari-news-engine/includes/class-ca-news-db.php";
            $expected = hash("sha256", "fresh-pairing-code");
            if (!CA_News_DB::store_agent_token_hash($expected)) { throw new Exception("Direct pairing write/read-back failed"); }
            if (!hash_equals($expected, CA_News_DB::agent_token_hash())) { throw new Exception("Pairing hash changed after read-back"); }
          '

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse agent scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem companion/calcioaffari-local-agent -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }

      - name: Verify Windows PowerShell UTF-8 encoding
        shell: pwsh
        run: |
          Get-ChildItem companion/calcioaffari-local-agent -Filter *.ps1 | ForEach-Object {
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            if ($bytes.Count -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              throw "$($_.Name) is missing the UTF-8 BOM required by Windows PowerShell 5.1."
            }
          }

      - name: Verify encrypted pairing-code round-trip
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "calcioaffari-credential-test.txt"
          $expected = "CaPairing2026TokenWithoutHttpBasicAuth"
          $secure = ConvertTo-SecureString $expected -AsPlainText -Force
          $encrypted = ConvertFrom-SecureString $secure
          [IO.File]::WriteAllText($path, $encrypted, (New-Object Text.UTF8Encoding($false)))
          $stored = [IO.File]::ReadAllText($path).Trim()
          $restored = ConvertTo-SecureString -String $stored
          $credential = [System.Management.Automation.PSCredential]::new("calcioaffari", $restored)
          if ($credential.GetNetworkCredential().Password -ne $expected) {
            throw "Encrypted credential round-trip failed."
          }

      - name: Verify first connection tolerates missing scheduled tasks
        shell: pwsh
        run: |
          . "companion/calcioaffari-local-agent/common.ps1"
          $missing = "CalcioAffari CI Missing $([Guid]::NewGuid().ToString('N'))"
          if (Test-CalcioAffariScheduledTask -Name $missing) { throw "The synthetic missing task unexpectedly exists." }
          if (Stop-CalcioAffariScheduledTask -Name $missing) { throw "Stopping a missing task must be a harmless no-op." }
          $installer = Get-Content "companion/calcioaffari-local-agent/install.ps1" -Raw
          if ($installer -match 'schtasks\.exe\s+/End') { throw "Installer still treats a missing scheduled task as a native-command error." }

      - name: Verify WordPress requests use form transport
        shell: pwsh
        run: |
          $root = "companion/calcioaffari-local-agent"
          $common = Get-Content (Join-Path $root "common.ps1") -Raw
          if ($common -notmatch 'FormUrlEncodedContent') { throw "Shared HTTP client does not use form transport." }
          if ($common -notmatch 'X-CalcioAffari-Token') { throw "Shared HTTP client does not provide the token-header fallback." }
          . (Join-Path $root "common.ps1")
          $token = "A" * 48
          $content = New-CalcioAffariFormContent -Token $token -Form @{ action = "probe"; payload = @{ title = "Calcio Affari" } }
          try { $encoded = $content.ReadAsStringAsync().GetAwaiter().GetResult() }
          finally { $content.Dispose() }
          if ($encoded -notmatch "agent_token=$token") { throw "The pairing token is missing from the encoded form." }
          if ($encoded -notmatch "action=probe") { throw "Scalar form fields are not encoded." }
          if ($encoded -notmatch "payload=") { throw "Structured form fields are not encoded." }
          $safe = Protect-CalcioAffariSecretText "Failure contained $token in the exception."
          if ($safe -match $token -or $safe -notmatch '\[CODICE_RIMOSSO\]') { throw "Pairing tokens are not redacted from diagnostics." }
          $oldLog = Join-Path $env:RUNNER_TEMP "calcioaffari-secret-log.txt"
          [IO.File]::WriteAllText($oldLog, "Historic failure: $token", (New-Object Text.UTF8Encoding($false)))
          Protect-CalcioAffariLogFile -Path $oldLog
          $scrubbed = [IO.File]::ReadAllText($oldLog)
          if ($scrubbed -match $token -or $scrubbed -notmatch '\[CODICE_RIMOSSO\]') { throw "Existing logs are not scrubbed during upgrade." }
          $setup = Get-Content (Join-Path $root "setup-gui.ps1") -Raw
          if ($setup -notmatch 'ESPORTA LOG' -or $setup -notmatch 'Protect-CalcioAffariSecretText') { throw "Setup does not expose a sanitized log export." }
          $files = @("install.ps1", "agent.ps1", "diagnose.ps1", "repair.ps1") | ForEach-Object { Join-Path $root $_ }
          foreach ($file in $files) {
            $source = Get-Content $file -Raw
            if ($source -notmatch 'common\.ps1') { throw "$file does not load the shared HTTP client." }
          }

      - name: Test HTTP response classification
        shell: pwsh
        run: |
          . "companion/calcioaffari-local-agent/common.ps1"
          $success = ConvertFrom-CalcioAffariResponse -StatusCode 200 -ContentType "application/json" -Body '{"version":"0.8.1","publication_mode":"review"}' -ExpectedProperties @("version", "publication_mode")
          if ($success.version -ne "0.8.1") { throw "Valid JSON response was not decoded." }
          $cases = @(
            @{ Status = 202; Type = "text/html"; Body = "<html>sgcaptcha</html>"; Code = "CA_SITEGROUND_BLOCK" },
            @{ Status = 401; Type = "application/json"; Body = '{"code":"rest_forbidden"}'; Code = "CA_AUTH_INVALID" },
            @{ Status = 400; Type = "text/plain"; Body = "0"; Code = "CA_PLUGIN_ENDPOINT_MISSING" },
            @{ Status = 200; Type = "text/html"; Body = "<html>login</html>"; Code = "CA_HTML_RESPONSE" },
            @{ Status = 200; Type = "application/json"; Body = '{"wrong":true}'; Code = "CA_INVALID_RESPONSE" }
          )
          foreach ($case in $cases) {
            try {
              ConvertFrom-CalcioAffariResponse -StatusCode $case.Status -ContentType $case.Type -Body $case.Body -ExpectedProperties @("version") | Out-Null
              throw "Expected $($case.Code)."
            } catch {
              if ((Get-CalcioAffariErrorCode $_) -ne $case.Code) { throw "Expected $($case.Code), got $(Get-CalcioAffariErrorCode $_)." }
            }
          }
          try {
            ConvertFrom-CalcioAffariResponse -StatusCode 400 -ContentType "application/json" -Body '{"code":"ca_news_bad_excerpt","message":"Sommario assente o fuori lunghezza.","data":{"status":400}}' | Out-Null
            throw "Expected CA_HTTP_400."
          } catch {
            if ((Get-CalcioAffariErrorCode $_) -ne "CA_HTTP_400") { throw "Expected CA_HTTP_400, got $(Get-CalcioAffariErrorCode $_)." }
            if ($_.Exception.Message -notmatch 'Sommario assente' -or $_.Exception.Message -notmatch 'ca_news_bad_excerpt') { throw "WordPress error detail was lost." }
          }

      - name: Verify authentication failures stop automatic retries
        shell: pwsh
        run: |
          $agent = Get-Content "companion/calcioaffari-local-agent/agent.ps1" -Raw
          $installer = Get-Content "companion/calcioaffari-local-agent/install.ps1" -Raw
          $dashboard = Get-Content "companion/calcioaffari-local-agent/dashboard.ps1" -Raw
          $setup = Get-Content "companion/calcioaffari-local-agent/setup-gui.ps1" -Raw
          foreach ($marker in @("CA_AUTH_INVALID", "CA_SITEGROUND_BLOCK", "connection-paused.txt")) {
            if ($agent -notmatch [regex]::Escape($marker)) { throw "Agent is missing $marker handling." }
          }
          if ($agent -notmatch 'Retry automatici sospesi') { throw "Agent does not stop authentication retries." }
          if ($installer -notmatch 'Stop-AgentTasks[\s\S]+Test-WordPressConnection') { throw "Installer does not stop the old agent before testing a new code." }
          if ($installer -notmatch '\^\[A-Za-z0-9\]\{48\}\$') { throw "Installer does not validate pairing-code format locally." }
          if ($dashboard -notmatch 'diagnose\.ps1' -or $dashboard -notmatch 'DiagnosticProcess') { throw "Dashboard diagnostics are not asynchronous." }
          if ($setup -notmatch 'CurrentProcess\.HasExited') { throw "Setup UI cannot detect a crashed backend." }
          if ($setup -notmatch 'taskkill\.exe /PID .* /T /F') { throw "Setup UI does not terminate the complete download process tree." }
          if ($agent -notmatch 'Get-CalcioAffariArticleWordCount') { throw "Agent does not measure article length locally." }
          if ($agent -match 'Invoke-CalcioAffariBodyRevision') { throw "Agent still expands copy to chase a word-count target." }
          if ($agent -notmatch 'Remove-CalcioAffariInlineUrls') { throw "Agent does not remove inline URLs locally." }
          if ($agent -notmatch 'senza riscritture artificiali') { throw "Out-of-target model output can still be expanded artificially." }
          if ($agent -notmatch 'Get-CalcioAffariEditorialIssues' -or $agent -notmatch "un'unica nuova stesura") { throw "Agent is missing the bounded editorial preflight." }

      - name: Verify local editorial length checks
        shell: pwsh
        run: |
          $env:CALCIOAFFARI_AGENT_TEST_MODE = "1"
          . "companion/calcioaffari-local-agent/agent.ps1"
          $result = [pscustomobject]@{ body_html = "<p>Una due tre quattro cinque.</p><h2>Sezione</h2><p>Sei sette otto nove dieci.</p>" }
          if ((Get-CalcioAffariArticleWordCount $result) -ne 11) { throw "HTML word count is not deterministic." }
          $job = [pscustomobject]@{ validation = [pscustomobject]@{ article_min_words = 180; article_max_words = 420 } }
          $limits = Get-CalcioAffariLengthLimits $job
          if ($limits.Minimum -ne 180 -or $limits.Maximum -ne 420) { throw "Server validation limits were not applied." }
          $legacy = Get-CalcioAffariLengthLimits ([pscustomobject]@{})
          if ($legacy.Minimum -ne 160 -or $legacy.Maximum -ne 360) { throw "Safe legacy limits changed unexpectedly." }

          $dirty = [pscustomobject]@{
            title = "Titolo https://example.com/t"
            excerpt = "Sommario https://example.com/e"
            body_html = '<p>Testo <a href="https://example.com/a">fonte</a> https://example.com/b (ID: 5) aol.co.uk</p>'
          }
          $clean = Remove-CalcioAffariInlineUrls $dirty
          if (($clean.title + $clean.excerpt + $clean.body_html) -match 'https?://' -or $clean.body_html -match 'ID:\s*5|aol\.co\.uk' -or $clean.body_html -notmatch 'fonte') {
            throw "Editorial artifact sanitization lost copy or left a technical marker."
          }

          $script:MockPass = 0
          function Invoke-OllamaStructuredRequest {
            param($Config, $Job, [string]$Prompt)
            $script:MockPass++
            return [pscustomobject]@{ body_html = '<p>' + ((1..120 | ForEach-Object { "parola$_" }) -join ' ') + '</p>' }
          }
          $job = [pscustomobject]@{
            id = 99
            prompt = "Crea la bozza."
            validation = [pscustomobject]@{ article_min_words = 160; article_max_words = 360 }
          }
          $short = Invoke-Ollama ([pscustomobject]@{}) $job
          if ($script:MockPass -ne 1 -or (Get-CalcioAffariArticleWordCount $short) -ne 120) {
            throw "A short draft was expanded instead of being preserved."
          }
          if (-not (@($short.safety_flags) -match 'Lunghezza editoriale fuori target')) {
            throw "A short result did not carry its editorial warning."
          }

          $script:RepairPass = 0
          function Invoke-OllamaStructuredRequest {
            param($Config, $Job, [string]$Prompt)
            $script:RepairPass++
            if ($script:RepairPass -eq 1) {
              return [pscustomobject]@{ title = "Manchester United reach agreement for signing"; excerpt = "A sufficiently long English summary that must be rewritten before WordPress receives it."; body_html = "<p>Short English draft.</p>" }
            }
            return [pscustomobject]@{ title = "Il Manchester United raggiunge l’accordo per il difensore"; excerpt = "Il club inglese ha raggiunto un accordo per il difensore secondo le informazioni contenute nelle prove disponibili."; body_html = '<p>' + ((1..120 | ForEach-Object { "parola$_" }) -join ' ') + '</p>'; safety_flags = @() }
          }
          $repaired = Invoke-Ollama ([pscustomobject]@{}) $job
          if ($script:RepairPass -ne 2 -or $repaired.title -notmatch '^Il Manchester United') { throw "The bounded language/quality repair did not run exactly once." }

      - name: Verify release versions and lifecycle
        shell: pwsh
        run: |
          $root = "companion/calcioaffari-local-agent"
          $expected = "1.0.9"
          $manifest = Get-Content (Join-Path $root "version.json") -Raw | ConvertFrom-Json
          if ($manifest.version -ne $expected) { throw "version.json mismatch." }
          foreach ($name in @("agent.ps1", "install.ps1", "setup-gui.ps1", "dashboard.ps1", "repair.ps1", "diagnose.ps1", "upgrade.ps1")) {
            $source = Get-Content (Join-Path $root $name) -Raw
            if ($source -notmatch '\$AgentVersion\s*=\s*"1\.0\.9"') { throw "$name version mismatch." }
          }
          $installer = Get-Content (Join-Path $root "installer.iss") -Raw
          if ($installer -notmatch '#define AppVersion "1\.0\.9"') { throw "Installer version mismatch." }
          if ($installer -notmatch 'Uninstallable=yes' -or $installer -notmatch '\[UninstallRun\]') { throw "Windows uninstall lifecycle is incomplete." }

      - name: Verify installer does not wait for configuration UI
        shell: pwsh
        run: |
          $installer = Get-Content "companion/calcioaffari-local-agent/installer.iss" -Raw
          $runSection = [regex]::Match($installer, '(?ms)^\[Run\]\s*(.*?)(?=^\[|\z)').Groups[1].Value
          $launcherRun = @($runSection -split "`r?`n" | Where-Object { $_ -match 'launcher\.ps1' })
          $upgradeRun = @($runSection -split "`r?`n" | Where-Object { $_ -match 'upgrade\.ps1' })
          if ($launcherRun.Count -ne 1 -or $launcherRun[0] -match 'waituntilterminated' -or $launcherRun[0] -notmatch 'Flags:\s+nowait') { throw "Installer does not launch the configuration window asynchronously." }
          if ($upgradeRun.Count -ne 1 -or $upgradeRun[0] -notmatch 'waituntilterminated') { throw "Installer does not wait for the bounded upgrade restart." }
          if ($installer -notmatch 'DestDir:\s+"\{app\}"') { throw "Runtime files are not installed persistently before launch." }

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found." }
          & $iscc "companion\calcioaffari-local-agent\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test install and uninstall lifecycle
        shell: pwsh
        run: |
          $setup = Resolve-Path "companion\calcioaffari-local-agent\dist\CalcioAffari-Local-Newsroom-Setup-v1.0.9.exe"
          $installLog = Join-Path $env:RUNNER_TEMP "calcioaffari-inno-install.log"
          $process = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/LOG=$installLog" -PassThru
          if (-not $process.WaitForExit(60000)) { Stop-Process $process -Force; throw "Installer did not terminate within 60 seconds." }
          if ($process.ExitCode -ne 0) { Get-Content $installLog -ErrorAction SilentlyContinue; throw "Installer failed with exit code $($process.ExitCode)." }
          $app = Join-Path $env:LOCALAPPDATA "CalcioAffari"
          foreach ($name in @("launcher.ps1", "common.ps1", "diagnose.ps1", "upgrade.ps1", "uninstall.ps1", "unins000.exe")) {
            if (-not (Test-Path (Join-Path $app $name))) { throw "Installed file missing: $name" }
          }
          . (Join-Path $app "common.ps1")
          $missing = "CalcioAffari Installer Missing $([Guid]::NewGuid().ToString('N'))"
          if (Stop-CalcioAffariScheduledTask -Name $missing) { throw "Installed helper did not tolerate a missing scheduled task." }
          $registered = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" | Get-ItemProperty | Where-Object DisplayName -eq "CalcioAffari Local Newsroom"
          if (-not $registered) { throw "Application is not registered in Windows uninstall settings." }

          $agentPath = Join-Path $app "agent.ps1"
          [IO.File]::WriteAllText($agentPath, "Start-Sleep -Seconds 300", (New-Object Text.UTF8Encoding($true)))
          @{
            site_url = "https://example.invalid"
            ollama_url = "http://127.0.0.1:11434"
            model = "qwen3:14b"
            worker_name = "CI-UPGRADE"
            poll_seconds = 30
            agent_version = "1.0.3"
          } | ConvertTo-Json | Set-Content (Join-Path $app "agent.json") -Encoding UTF8
          $secure = ConvertTo-SecureString ("A" * 48) -AsPlainText -Force
          [IO.File]::WriteAllText((Join-Path $app "agent-token.txt"), (ConvertFrom-SecureString $secure), (New-Object Text.UTF8Encoding($false)))
          $taskCommand = "powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$agentPath`""
          & schtasks.exe /Create /TN "CalcioAffari Local Agent" /SC ONLOGON /TR $taskCommand /RL LIMITED /F | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Unable to create the synthetic legacy task." }
          & schtasks.exe /Run /TN "CalcioAffari Local Agent" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Unable to start the synthetic legacy task." }
          $legacyPid = $null
          foreach ($attempt in 1..20) {
            Start-Sleep -Milliseconds 250
            $legacyPid = Get-CimInstance Win32_Process | Where-Object { [string]$_.CommandLine -like ("*" + $agentPath + "*") } | Select-Object -First 1 -ExpandProperty ProcessId
            if ($legacyPid) { break }
          }
          if (-not $legacyPid) { throw "Synthetic legacy agent did not start." }

          $upgradeInstallLog = Join-Path $env:RUNNER_TEMP "calcioaffari-inno-upgrade.log"
          $upgrade = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/LOG=$upgradeInstallLog" -PassThru
          if (-not $upgrade.WaitForExit(60000)) { Stop-Process $upgrade -Force; throw "Upgrade did not terminate within 60 seconds." }
          if ($upgrade.ExitCode -ne 0) { Get-Content $upgradeInstallLog -ErrorAction SilentlyContinue; throw "Upgrade failed with exit code $($upgrade.ExitCode)." }
          if (Get-Process -Id ([int]$legacyPid) -ErrorAction SilentlyContinue) { throw "The legacy agent process survived the upgrade." }
          if ((Get-Content $agentPath -Raw) -notmatch '\$AgentVersion\s*=\s*"1\.0\.9"') { throw "The current agent was not installed over the legacy process." }
          $upgradeLog = Join-Path $app "upgrade.log"
          if (-not (Test-Path $upgradeLog) -or (Get-Content $upgradeLog -Raw) -notmatch 'v1\.0\.9 riavviato automaticamente') { throw "The installer did not restart the upgraded agent automatically." }
          if (-not (Test-CalcioAffariScheduledTask -Name "CalcioAffari Local Agent") -or -not (Test-CalcioAffariScheduledTask -Name "CalcioAffari Local Agent Watchdog")) { throw "Upgrade did not recreate both scheduled tasks." }

          $uninstaller = Join-Path $app "unins000.exe"
          $uninstall = Start-Process $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          if (-not $uninstall.WaitForExit(60000)) { Stop-Process $uninstall -Force; throw "Uninstaller did not terminate within 60 seconds." }
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($uninstall.ExitCode)." }
          Start-Sleep -Seconds 2
          if (Test-Path (Join-Path $app "launcher.ps1")) { throw "Application files remain after uninstall." }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: calcioaffari-local-newsroom-windows
          path: companion/calcioaffari-local-agent/dist/*.exe
          if-no-files-found: error

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable archives
        shell: bash
        run: |
          theme_version=$(awk '/^Version:/{print $2; exit}' style.css)
          plugin_version=$(awk '/^[[:space:]]*\*[[:space:]]Version:/{print $3; exit}' companion/calcioaffari-news-engine/calcioaffari-news-engine.php)
          agent_version=$(php -r '$v=json_decode(file_get_contents("companion/calcioaffari-local-agent/version.json"), true); echo $v["version"];')
          mkdir -p dist/theme/calcioaffari dist/plugin dist/agent
          rsync -a ./ dist/theme/calcioaffari/ --exclude '.git/' --exclude '.github/' --exclude 'companion/' --exclude 'tests/' --exclude 'dist/'
          cp -R companion/calcioaffari-news-engine dist/plugin/calcioaffari-news-engine
          cp -R companion/calcioaffari-local-agent dist/agent/calcioaffari-local-agent
          (cd dist/theme && zip -qr "../calcioaffari-theme-v${theme_version}.zip" calcioaffari)
          (cd dist/plugin && zip -qr "../calcioaffari-news-engine-v${plugin_version}.zip" calcioaffari-news-engine)
          (cd dist/agent && zip -qr "../calcioaffari-local-newsroom-v${agent_version}.zip" calcioaffari-local-agent)
          unzip -t "dist/calcioaffari-theme-v${theme_version}.zip"
          unzip -t "dist/calcioaffari-news-engine-v${plugin_version}.zip"
          unzip -t "dist/calcioaffari-local-newsroom-v${agent_version}.zip"

  plugin-retries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded job retries and migration
        shell: bash
        run: |
          db="companion/calcioaffari-news-engine/includes/class-ca-news-db.php"
          rest="companion/calcioaffari-news-engine/includes/class-ca-news-rest.php"
          admin="companion/calcioaffari-news-engine/includes/class-ca-news-admin.php"
          grep -q 'attempt_count smallint' "$db"
          grep -q "'max_job_attempts' => 3" "$db"
          grep -q "attempt_count < %d" "$rest"
          grep -q "attempt_count.*+ 1" "$rest"
          grep -q "attempt_count' => 0" "$admin"
          grep -q 'ca_news_last_ingest_at' companion/calcioaffari-news-engine/includes/class-ca-news-ingestor.php
          grep -q 'CA_News_Ingestor::run' "$rest"

  release-1-0-9:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/pairing-token'
    needs: [php, powershell, windows-installer, packages, plugin-retries]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: calcioaffari-local-newsroom-windows
          path: dist

      - name: Package verified release assets
        shell: pwsh
        run: |
          Compress-Archive -Path "companion\calcioaffari-news-engine" -DestinationPath "dist\calcioaffari-news-engine-v0.8.7.zip" -CompressionLevel Optimal -Force
          $assets = @(
            "dist\CalcioAffari-Local-Newsroom-Setup-v1.0.9.exe",
            "dist\calcioaffari-news-engine-v0.8.7.zip"
          )
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($asset))"
          }
          [IO.File]::WriteAllLines((Join-Path $PWD "dist\SHA256SUMS.txt"), $lines, (New-Object Text.UTF8Encoding($false)))

      - name: Publish permanent GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.9 --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v1.0.9 already exists; no asset is overwritten."
            exit 0
          }
          @"
          Audit editoriale successivo alla verifica sul sito reale.

          - App Windows 1.0.9 e plugin WordPress 0.8.7
          - GDELT headline-only disattivato e vecchie code non elaborate messe in quarantena
          - feed professionali BBC Sport, The Guardian, Sky Sports e Football Italia
          - filtro preventivo per pertinenza, lingua, alfabeto e sostanza delle prove
          - blocco deterministico di NCAA, tennis, altri sport, preview e calendari
          - minimo redazionale reale di 80 parole e una sola nuova stesura di qualità
          - titoli esteri sempre tradotti e alfabeti non supportati bloccati
          - sottotitoli iniziali duplicati rimossi
          - classificazione affare soltanto con calciatore e almeno un club coinvolto
          - nessuna riscrittura artificiale finalizzata alla lunghezza
          - divieto di dedurre appartenenze ai club o collegare fatti distinti
          - domini, testate e ID tecnici rimossi deterministicamente dal testo
          - fonti mostrate allineate all'unione dei claim realmente utilizzati
          - claim parzialmente malformati diventano un avviso di revisione e non distruggono il job
          - controllo conservativo dei refusi e delle preposizioni osservati nell'audit live
          - qualsiasi contenuto fuori target resta in revisione anche in modalità automatica
          - filtro per gli usi fuori tema della parola mercato
          - rimozione automatica degli URL inline senza perdere il testo
          - tentativi WordPress limitati prima di uno scarto definitivo
          - recupero automatico dei job respinti dal precedente difetto
          - messaggio esplicito quando il plugin WordPress o l'endpoint non sono attivi
          - menu principale CalcioAffari con accesso a Core, Affari, Club e Giocatori
          - diagnostica esportabile senza credenziali
          - aggiornamento con arresto e riavvio automatico dell'agente precedente
          - installazione, aggiornamento e disinstallazione verificati su Windows

          Prima di collegare l'app, aggiorna il plugin WordPress incluso alla versione 0.8.7.
          "@ | Set-Content release-notes.md -Encoding UTF8
          gh release create v1.0.9 --target "${{ github.event.pull_request.head.sha }}" --title "CalcioAffari Local Newsroom 1.0.9" --notes-file release-notes.md dist\CalcioAffari-Local-Newsroom-Setup-v1.0.9.exe dist\calcioaffari-news-engine-v0.8.7.zip dist\SHA256SUMS.txt --repo "${{ github.repository }}"

  release-plugin-0-8-9:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/pairing-token'
    needs: [php, packages, plugin-retries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Package audited plugin
        shell: bash
        run: |
          mkdir -p dist/plugin
          cp -R companion/calcioaffari-news-engine dist/plugin/calcioaffari-news-engine
          (cd dist/plugin && zip -qr ../calcioaffari-news-engine-v0.8.9.zip calcioaffari-news-engine)
          unzip -t dist/calcioaffari-news-engine-v0.8.9.zip
          sha256sum dist/calcioaffari-news-engine-v0.8.9.zip > dist/SHA256SUMS-plugin-v0.8.9.txt

      - name: Publish permanent plugin release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view plugin-v0.8.9 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release plugin-v0.8.9 already exists; no asset is overwritten."
            exit 0
          fi
          cat > release-notes-plugin.md <<'EOF'
          Plugin WordPress CalcioAffari News Engine 0.8.9 per CalcioAffari Local Newsroom 1.0.9 o successivo.

          Audit eseguito sul primo ciclo reale delle nuove fonti professionali:
          - pertinenza determinata dal titolo e non da citazioni incidentali nell'estratto;
          - bloccati profili, interviste, cronache, infortuni, partite e analisi calcistiche generiche;
          - conservate trattative esplicite, accordi, prestiti, rinnovi, offerte, visite mediche e trasferimenti;
          - conservate anche corse di mercato esplicite e risoluzioni contrattuali, dopo il controllo live dei job #88 e #101;
          - coda non elaborata ricontrollata automaticamente durante l'aggiornamento;
          - lease precedenti azzerati prima della rivalidazione, impedendo invii basati sulle vecchie regole;
          - GDELT resta disattivato; BBC Sport, The Guardian, Sky Sports e Football Italia restano attivi.

          La modalità di pubblicazione rimane Revisione editoriale.
          EOF
          gh release create plugin-v0.8.9 \
            --target "${{ github.event.pull_request.head.sha }}" \
            --title "CalcioAffari News Engine 0.8.9" \
            --notes-file release-notes-plugin.md \
            dist/calcioaffari-news-engine-v0.8.9.zip \
            dist/SHA256SUMS-plugin-v0.8.9.txt \
            --repo "${{ github.repository }}"
