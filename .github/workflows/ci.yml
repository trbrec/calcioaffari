  release-plugin-1-0-8:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/pairing-token'
    needs: [php, packages, plugin-retries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Package audited plugin
        shell: bash
        run: |
          mkdir -p dist/plugin
          cp -R companion/calcioaffari-news-engine dist/plugin/calcioaffari-news-engine
          (cd dist/plugin && zip -qr ../calcioaffari-news-engine-v1.0.8.zip calcioaffari-news-engine)
          unzip -t dist/calcioaffari-news-engine-v1.0.8.zip
          sha256sum dist/calcioaffari-news-engine-v1.0.8.zip > dist/SHA256SUMS-plugin-v1.0.8.txt

      - name: Publish permanent plugin release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view plugin-v1.0.8 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release plugin-v1.0.8 already exists; no asset is overwritten."
            exit 0
          fi
          cat > release-notes-plugin.md <<'EOF'
          Plugin WordPress CalcioAffari News Engine 1.0.8 per CalcioAffari Local Newsroom 1.1.1 o successivo.

          Correzioni verificate sul controllo live:
          - ogni risultato viene creato esclusivamente nella sezione Affari;
          - i contenuti IA non pubblicati finiti negli Articoli vengono messi in quarantena reversibile;
          - i risultati non riferiti a una singola operazione vengono bloccati;
          - i titoli che combinano due trasferimenti vengono esclusi prima della coda;
          - le formule generiche non sostenute dalle prove vengono bloccate anche in PHP;
          - la coda dedica quattro elaborazioni su cinque all'archivio e una alle notizie recenti, con priorità alle fonti italiane;
          - il pannello mostra la versione effettiva dell'app collegata;
          - backfill dal 29/07/2026 e refresh ogni cinque minuti restano attivi.
          - la coda alterna davvero la data fonte più recente e più vecchia, non l'ordine tecnico di inserimento;
          - i digest multi-notizia vengono ancorati alla singola operazione esplicita nel titolo;
          - le quarantene senza post vengono rimesse in coda con le regole corrette.
          - il feed ufficiale Calciomercato di Gazzetta viene aggiunto alle fonti italiane.
          - le quarantene recuperate vengono rivalidate prima di consumare tempo IA;
          - un articolo viene bloccato se non nomina il calciatore presente nei dati strutturati;
          - i contatori della coda seguono anche pubblicazioni e ripristini manuali.
          - gli avvisi deterministici su lunghezza, sintesi delle prove e pulizia tecnica restano visibili ma non fermano più l'autopubblicazione dopo il doppio audit;
          - qualsiasi safety flag sconosciuto o materiale continua a bloccare l'articolo.

          L'aggiornamento non modifica la modalità scelta nel pannello: la configurazione corrente resta invariata.
          EOF
          gh release create plugin-v1.0.8 \
            --target "${{ github.event.pull_request.head.sha }}" \
            --title "CalcioAffari News Engine 1.0.8" \
            --notes-file release-notes-plugin.md \
            dist/calcioaffari-news-engine-v1.0.8.zip \
            dist/SHA256SUMS-plugin-v1.0.8.txt \
            --repo "${{ github.repository }}"
