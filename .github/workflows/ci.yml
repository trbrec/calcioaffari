          - installazione, aggiornamento e disinstallazione verificati su Windows

          Il revisore accetta parafrasi semanticamente fedeli ma continua a bloccare ogni nuovo fatto materiale. La modalità resta Revisione editoriale.
          "@ | Set-Content release-notes.md -Encoding UTF8
