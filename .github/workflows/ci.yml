          - live blog, roundup, tracker e titoli con più operazioni messi in quarantena
          - blocco deterministico di NCAA, tennis, altri sport, preview e calendari
          - minimo redazionale reale di 80 parole e fino a due riscritture guidate dopo la prima stesura
          - titoli esteri sempre tradotti e alfabeti non supportati bloccati
          - sottotitoli bloccati nei brevi di agenzia
          - classificazione affare soltanto con calciatore e almeno un club coinvolto
          - nessuna riscrittura artificiale finalizzata alla lunghezza
          - divieto di dedurre appartenenze ai club o collegare fatti distinti
          - domini e ID tecnici rimossi deterministicamente; nome della testata preservato nell'attribuzione
          - ogni claim accompagnato da un estratto letterale verificato nella fonte dichiarata
          - fonti mostrate identiche all'unione dei claim realmente provati
