          Correzione runtime Windows verificata sul ciclo completo di installazione e aggiornamento.

          - App Windows 1.1.1 e plugin WordPress 1.0.2
          - watchdog ogni cinque minuti senza creazione di finestre PowerShell
          - avvio automatico tramite Windows Script Host, processo privo di console
          - migrazione automatica delle attività pianificate create dalle versioni precedenti
          - collegamenti desktop, menu Start, pannello e riparazione privi di console
